name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    timeout-minutes: 15
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Theme token guard
        run: npm run check:colors

      - name: Unit tests
        run: npm test

      # The component suite is separate because it needs the Svelte compiler.
      # Left out of CI, the things only a mounted component can be wrong about
      # would be checked nowhere.
      - name: Component tests
        run: npm run test:ui

      # The performance budgets (npm run test:perf) are deliberately not run
      # here. They time real work against a 16ms frame, and a shared two-core
      # runner measures the runner, not the code — a red build nobody could
      # act on. They are part of `npm run check:all`, on a real machine.

  build:
    timeout-minutes: 40
    name: Build (${{ matrix.platform }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # `libappindicator3-dev` is deliberately absent: it is unsatisfiable on
        # the runner now, and it is the superseded package anyway — Tauri 2
        # wants the ayatana one, which is here.
        env:
          # apt must never be able to ask a question here: there is nobody to
          # answer it, and the job hangs until the six-hour limit rather than
          # failing. The release build did exactly that.
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          # The runner boots with unattended-upgrades holding the dpkg lock,
          # and apt waits for that lock with no deadline at all: the job sits
          # in this step until the timeout kills it, which it has now done
          # twice. Stop the updater, and give apt a deadline so a lock it
          # cannot get fails the step in five minutes instead of staring at
          # the wall for forty.
          sudo systemctl stop unattended-upgrades apt-daily.service \
            apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer || true
          sudo pkill -9 -f 'apt-get|unattended-upgrade' || true
          sudo dpkg --configure -a || true
          # A stalled download is the other way this step eats the clock: the
          # Azure mirror hands out a 9.5MB package over sixteen minutes and
          # then stops mid-file. Without a deadline apt sits on that dead
          # connection; with one it gives up on it and asks again.
          APT_OPTS='-o DPkg::Lock::Timeout=300 -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential \
            curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build application bundle
        run: npm run tauri build -- --ci
