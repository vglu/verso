# Dependency updates.
#
# Grouped and monthly on purpose: this is a small project, and a pull request
# per patch bump is noise that teaches everyone to stop reading them.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      tauri:
        patterns: ['@tauri-apps/*']
      dev:
        dependency-type: development

  - package-ecosystem: cargo
    directory: '/src-tauri'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ['tauri*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
