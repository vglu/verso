[package]
name = "verso"
version = "0.1.0"
description = "Beautiful, instant, cross-platform Markdown viewer & editor"
authors = ["SIMS tech"]
license = "MIT"
repository = "https://github.com/sims-tech/verso"
edition = "2021"
rust-version = "1.77"

[lib]
name = "verso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "6"
notify-debouncer-full = "0.3"
encoding_rs = "0.8"
# Firefox's encoding detector. Guessing a legacy 8-bit encoding cannot be done
# by validity — nearly every byte sequence is "valid" windows-1252 — so it
# takes statistics over the text, which is exactly what this crate is.
chardetng = "1.0"
sha2 = "0.10"
# Pictures are embedded into exported documents as data URIs.
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
